<svg xmlns="http://www.w3.org/2000/svg" width="360" height="160" viewBox="0 0 360 160" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">Fábio Jean Serviços Elétricos</title>
  <desc id="logoDesc">Logo original com monograma FJ, raio elétrico e circuitos técnicos.</desc>
  <defs>
    <linearGradient id="emblemGradient" x1="22" y1="19" x2="138" y2="141" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00d4ff"/>
      <stop offset="0.48" stop-color="#005eff"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="boltGradient" x1="81" y1="34" x2="55" y2="127" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff3a3"/>
      <stop offset="0.45" stop-color="#f0c419"/>
      <stop offset="1" stop-color="#00d4ff"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="360" height="160" fill="none"/>

  <g transform="translate(12 10)">
    <path d="M68 3 123 35v64l-55 32-55-32V35L68 3Z" fill="#0b1220" stroke="url(#emblemGradient)" stroke-width="7" stroke-linejoin="round"/>
    <path d="M68 18 109 42v49l-41 24-41-24V42l41-24Z" fill="#111827" stroke="#00d4ff" stroke-opacity=".55" stroke-width="2"/>

    <path d="M72 28 49 77h22l-10 45 31-58H69l3-36Z" fill="url(#boltGradient)" filter="url(#softGlow)"/>

    <path d="M37 42h18M89 42h17M35 96h18M88 96h16" fill="none" stroke="#00d4ff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="33" cy="42" r="4" fill="#f0c419"/>
    <circle cx="110" cy="42" r="4" fill="#f0c419"/>
    <circle cx="31" cy="96" r="4" fill="#f0c419"/>
    <circle cx="108" cy="96" r="4" fill="#f0c419"/>

    <text x="28" y="83" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="800" fill="#f7fbff" letter-spacing="0">F</text>
    <text x="87" y="100" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="800" fill="#f7fbff" letter-spacing="0">J</text>
  </g>

  <g transform="translate(154 35)">
    <text x="0" y="30" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="800" fill="#f7fbff" letter-spacing="0">FÁBIO JEAN</text>
    <rect x="0" y="42" width="159" height="4" rx="2" fill="#005eff"/>
    <rect x="159" y="42" width="34" height="4" rx="2" fill="#f0c419"/>
    <text x="0" y="69" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#00d4ff" letter-spacing="0">RESP. TÉCNICO</text>
    <text x="0" y="92" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#f7fbff" letter-spacing="0">SERVIÇOS ELÉTRICOS</text>
    <text x="0" y="113" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#f0c419" letter-spacing="0">SEGURANÇA • PROJETO • EXECUÇÃO</text>
  </g>
</svg>
