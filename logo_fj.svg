<svg xmlns="http://www.w3.org/2000/svg" width="420" height="160" viewBox="0 0 420 160" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">Fabio Jean Serviços Elétricos</title>
  <desc id="logoDesc">Logo original com monograma FJ, raio elétrico central e linhas técnicas.</desc>
  <defs>
    <linearGradient id="shieldStroke" x1="14" y1="15" x2="138" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00d4ff"/>
      <stop offset="0.55" stop-color="#005eff"/>
      <stop offset="1" stop-color="#003b99"/>
    </linearGradient>
    <linearGradient id="boltFill" x1="78" y1="30" x2="55" y2="122" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff4a8"/>
      <stop offset="0.5" stop-color="#f0c419"/>
      <stop offset="1" stop-color="#00d4ff"/>
    </linearGradient>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="420" height="160" fill="none"/>

  <g transform="translate(12 11)">
    <path d="M68 4 126 37v66l-58 33-58-33V37L68 4Z" fill="#0b1220" stroke="url(#shieldStroke)" stroke-width="7" stroke-linejoin="round"/>
    <path d="M68 20 108 43v47l-40 23-40-23V43l40-23Z" fill="#101827" stroke="#00d4ff" stroke-opacity=".55" stroke-width="2"/>

    <path d="M35 48h20M81 48h22M33 93h22M82 93h22" fill="none" stroke="#00d4ff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="31" cy="48" r="4" fill="#f0c419"/>
    <circle cx="108" cy="48" r="4" fill="#f0c419"/>
    <circle cx="29" cy="93" r="4" fill="#f0c419"/>
    <circle cx="109" cy="93" r="4" fill="#f0c419"/>

    <text x="46" y="86" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="900" fill="#f7fbff" letter-spacing="0">F</text>
    <text x="91" y="86" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="900" fill="#f7fbff" letter-spacing="0">J</text>
    <path d="M72 28 53 73h19l-9 42 31-55H73l-1-32Z" fill="url(#boltFill)" filter="url(#glow)"/>
  </g>

  <g transform="translate(158 36)">
    <text x="0" y="30" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="900" fill="#f7fbff" letter-spacing="0">FABIO JEAN</text>
    <rect x="0" y="42" width="158" height="4" rx="2" fill="#005eff"/>
    <rect x="158" y="42" width="36" height="4" rx="2" fill="#f0c419"/>
    <text x="0" y="68" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#00d4ff" letter-spacing="0">RESP. TÉCNICO</text>
    <text x="0" y="91" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" fill="#f7fbff" letter-spacing="0">SERVIÇOS ELÉTRICOS</text>
    <text x="0" y="112" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="800" fill="#f0c419" letter-spacing="0">SEGURANÇA • PROJETO • EXECUÇÃO</text>
  </g>
</svg>
